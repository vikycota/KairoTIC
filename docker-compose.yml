services:
  db:
    image: postgres:16-alpine
    container_name: kairo_db
    restart: unless-stopped
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net
    # No exponemos el puerto 5432 al host: solo accesible dentro de la red interna
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: kairo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_user
      - db_password
      - db_name
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER_FILE: /run/secrets/db_user
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME_FILE: /run/secrets/db_name
    networks:
      - backend_net
      - frontend_net
    # Publicado al host solo para desarrollo local (npm run dev / vite proxy).
    # En producción esto debería volver a "expose" para que solo Caddy sea público.
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: kairo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - frontend_net
    expose:
      - "80"   

  caddy:
    image: caddy:2-alpine
    container_name: kairo_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  db_name:
    file: ./secrets/db_name.txt

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  backend_net:
    internal: true    # la red de la DB no tiene salida a internet, solo backend↔db
  frontend_net: